name: skill-flow

services:
  skill-flow:
    build: .
    image: skill-flow:local
    container_name: skill-flow
    ports:
      - "${SKILL_FLOW_PORT:-8788}:8788"
    env_file:
      - path: .env
        required: false
    environment:
      SKILL_FLOW_HOST: "0.0.0.0"
      SKILL_FLOW_PORT: "8788"
      SKILL_FLOW_CATALOG_DIR: /app/catalog
    volumes:
      - skill-flow-home:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  skill-flow-home:
