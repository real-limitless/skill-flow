# Dev and prod may share one Docker host. Do not pin container_name or a host
# port: those are global to the daemon and the second stack fails to start.
# Give each stack its own project name (Dokploy sets COMPOSE_PROJECT_NAME per
# application). Networks, volumes, and the default container name then stay
# distinct. The process still listens on 8788; Traefik routes to the exposed
# port. Set SKILL_FLOW_IMAGE when two stacks build different tags.
name: skill-flow

services:
  # One-shot: the app runs as the non-root node user (uid 1000). Volumes created
  # by older root images are owned by root, so fix ownership before start.
  skill-flow-data-init:
    image: busybox:1.36
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - skill-flow-home:/data
    restart: "no"

  skill-flow:
    build: .
    image: ${SKILL_FLOW_IMAGE:-skill-flow:${COMPOSE_PROJECT_NAME:-local}}
    depends_on:
      skill-flow-data-init:
        condition: service_completed_successfully
    expose:
      - "8788"
    env_file:
      - path: .env
        required: false
    environment:
      SKILL_FLOW_HOST: "0.0.0.0"
      SKILL_FLOW_PORT: "8788"
      SKILL_FLOW_CATALOG_DIR: /app/catalog
      SKILL_FLOW_HOME: /data
    volumes:
      - skill-flow-home:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  skill-flow-home:
